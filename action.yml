# SPDX-License-Identifier: GPL-3.0-or-later
# Thin GitHub Action wrapper around `deglyph scan`.
# Usage in a consumer repo:
#   - uses: deglyph-re/cli@0.0.1
#     with:
#       path: build/app.exe
#       sarif: deglyph.sarif
#       comment: "true"   # post a sticky PR comment with the markdown report
name: deglyph scan
description: Scan native binaries for hardening posture, secrets, libs, CVEs, risky imports, and drift.
branding:
  icon: search
  color: orange

inputs:
  path:
    description: Binary or directory to scan.
    required: true
  baseline:
    description: Optional prior build to diff against.
    required: false
    default: ""
  fail-on:
    description: Minimum finding level that fails the job (note|warning|error|never).
    required: false
    default: warning
  sarif:
    description: Path to write a SARIF report to (empty = human text to the log).
    required: false
    default: ""
  entropy:
    description: Also flag high-entropy blobs (noisier).
    required: false
    default: "false"
  cve:
    description: Query osv.dev for CVEs against detected libraries (needs network).
    required: false
    default: "false"
  no-hardening:
    description: Skip the cross-platform hardening posture check.
    required: false
    default: "false"
  no-fingerprint:
    description: Skip third-party library fingerprinting.
    required: false
    default: "false"
  comment:
    description: When "true" and the event is a pull_request, post a sticky markdown comment.
    required: false
    default: "false"
  github-token:
    description: Token used to post the PR comment (defaults to GITHUB_TOKEN).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - shell: bash
      run: pip install --upgrade deglyph

    # Primary scan: gates the job, writes SARIF when requested.
    - shell: bash
      # Inputs are passed via env (not interpolated into the script) to avoid injection.
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_FAIL_ON: ${{ inputs.fail-on }}
        DG_SARIF: ${{ inputs.sarif }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
      run: |
        args=("$DG_PATH" --fail-on "$DG_FAIL_ON")
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        if [ -n "$DG_SARIF" ]; then
          deglyph scan "${args[@]}" --format sarif --output "$DG_SARIF"
        else
          deglyph scan "${args[@]}"
        fi

    # Markdown report for the PR comment (only on pull_request events when
    # comment=true). Runs with --fail-on never so a failing scan still produces
    # the comment; the gating step above is what fails the job.
    - id: dg-markdown
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
      run: |
        args=("$DG_PATH" --fail-on never --format markdown --output "${RUNNER_TEMP}/deglyph-pr.md")
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        deglyph scan "${args[@]}"

    - uses: actions/github-script@v9
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const marker = '<!-- deglyph-comment -->';
          const reportPath = path.join(process.env.RUNNER_TEMP, 'deglyph-pr.md');
          const body = marker + '\n' + fs.readFileSync(reportPath, 'utf8');
          const {data: comments} = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
