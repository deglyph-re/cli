# SPDX-License-Identifier: GPL-3.0-or-later
# Thin GitHub Action wrapper around `deglyph scan`.
# Usage in a consumer repo:
#   - uses: deglyph-re/cli@v1.2.0
#     with:
#       path: build/app.exe
#       upload-sarif: "true"   # publish findings to the Security tab
#       comment: "true"        # post a sticky PR comment with the markdown report
#
# A run-level summary is written to the Actions run page by default (summary).
# Permissions the caller's job must grant for the optional features:
#   upload-sarif: "true"  -> permissions: security-events: write
#   comment: "true"       -> permissions: pull-requests: write
name: deglyph scan
description: Scan native binaries for hardening posture, secrets, libs, CVEs, risky imports, and drift.
branding:
  icon: search
  color: orange

inputs:
  path:
    description: Binary or directory to scan.
    required: true
  baseline:
    description: Optional prior build to diff against.
    required: false
    default: ""
  fail-on:
    description: Minimum finding level that fails the job (note|warning|error|never).
    required: false
    default: warning
  sarif:
    description: Path to write a SARIF report to (empty = human text to the log).
    required: false
    default: ""
  entropy:
    description: Also flag high-entropy blobs (noisier).
    required: false
    default: "false"
  cve:
    description: Query osv.dev for CVEs against detected libraries (needs network).
    required: false
    default: "false"
  offline:
    description: Never touch the network; report CVEs as not-checked rather than clean.
    required: false
    default: "false"
  lib-signatures:
    description: "Path to an extra library signature database (JSON) merged with the built-ins."
    required: false
    default: ""
  no-hardening:
    description: Skip the cross-platform hardening posture check.
    required: false
    default: "false"
  no-fingerprint:
    description: Skip third-party library fingerprinting.
    required: false
    default: "false"
  ignore:
    description: Suppress findings by rule id (comma/space separated; a trailing '/' ignores a category, e.g. "secret/credential-keyword, harden/unsigned").
    required: false
    default: ""
  ignore-file:
    description: "Path to a .deglyphignore suppression file (rule ids, categories, and fingerprint lines)."
    required: false
    default: ""
  rule-config:
    description: "Path to a .deglyphrules JSON file of per-rule level overrides."
    required: false
    default: ""
  summary:
    description: Write the markdown report to the Actions run summary (every run).
    required: false
    default: "true"
  badge:
    description: "Write a shields.io endpoint JSON summarizing the run to this path (empty = skip). Publish it and embed with https://img.shields.io/endpoint?url=<raw url>."
    required: false
    default: ""
  upload-sarif:
    description: "Upload the SARIF report to code scanning (Security tab). Requires security-events: write."
    required: false
    default: "false"
  comment:
    description: When "true" and the event is a pull_request, post a sticky markdown comment.
    required: false
    default: "false"
  github-token:
    description: Token used to post the PR comment (defaults to GITHUB_TOKEN).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - shell: bash
      run: pip install --upgrade deglyph

    # Primary scan: gates the job, writes SARIF when requested or when an upload
    # is asked for (a default temp path). The resolved path is exported so the
    # upload step can find it even if this step fails the gate.
    - id: scan
      shell: bash
      # Inputs are passed via env (not interpolated into the script) to avoid injection.
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_FAIL_ON: ${{ inputs.fail-on }}
        DG_SARIF: ${{ inputs.sarif }}
        DG_UPLOAD: ${{ inputs.upload-sarif }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_OFFLINE: ${{ inputs.offline }}
        DG_LIB_SIGS: ${{ inputs.lib-signatures }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
        DG_IGNORE: ${{ inputs.ignore }}
        DG_IGNORE_FILE: ${{ inputs.ignore-file }}
        DG_RULE_CONFIG: ${{ inputs.rule-config }}
      run: |
        sarif="$DG_SARIF"
        if [ -z "$sarif" ] && [ "$DG_UPLOAD" = "true" ]; then
          sarif="${RUNNER_TEMP}/deglyph.sarif"
        fi
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        args=("$DG_PATH" --fail-on "$DG_FAIL_ON")
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ -n "$DG_IGNORE_FILE" ] && args+=(--ignore-file "$DG_IGNORE_FILE")
        [ -n "$DG_RULE_CONFIG" ] && args+=(--rule-config "$DG_RULE_CONFIG")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$DG_LIB_SIGS" ] && args+=(--lib-signatures "$DG_LIB_SIGS")
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        for rule in ${DG_IGNORE//,/ }; do args+=(--ignore "$rule"); done
        if [ -n "$sarif" ]; then
          deglyph scan "${args[@]}" --format sarif --output "$sarif"
        else
          deglyph scan "${args[@]}"
        fi

    # Run-level summary: append the markdown report to the Actions run page on
    # every run (push and PR). --fail-on never so a failing gate still renders;
    # if: always() so it runs even after the gating step fails the job.
    - if: ${{ always() && inputs.summary == 'true' }}
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_OFFLINE: ${{ inputs.offline }}
        DG_LIB_SIGS: ${{ inputs.lib-signatures }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
        DG_IGNORE: ${{ inputs.ignore }}
        DG_IGNORE_FILE: ${{ inputs.ignore-file }}
        DG_RULE_CONFIG: ${{ inputs.rule-config }}
      run: |
        args=("$DG_PATH" --fail-on never --format markdown)
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ -n "$DG_IGNORE_FILE" ] && args+=(--ignore-file "$DG_IGNORE_FILE")
        [ -n "$DG_RULE_CONFIG" ] && args+=(--rule-config "$DG_RULE_CONFIG")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$DG_LIB_SIGS" ] && args+=(--lib-signatures "$DG_LIB_SIGS")
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        for rule in ${DG_IGNORE//,/ }; do args+=(--ignore "$rule"); done
        deglyph scan "${args[@]}" >> "$GITHUB_STEP_SUMMARY"

    # Per-run badge: write a shields.io endpoint JSON to the requested path.
    # --fail-on never so a failing gate still produces it; if: always() so it
    # runs after the gate fails. Publishing the file is the caller's step.
    - if: ${{ always() && inputs.badge != '' }}
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BADGE: ${{ inputs.badge }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_OFFLINE: ${{ inputs.offline }}
        DG_LIB_SIGS: ${{ inputs.lib-signatures }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
        DG_IGNORE: ${{ inputs.ignore }}
        DG_IGNORE_FILE: ${{ inputs.ignore-file }}
        DG_RULE_CONFIG: ${{ inputs.rule-config }}
      run: |
        args=("$DG_PATH" --fail-on never --format badge --output "$DG_BADGE")
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ -n "$DG_IGNORE_FILE" ] && args+=(--ignore-file "$DG_IGNORE_FILE")
        [ -n "$DG_RULE_CONFIG" ] && args+=(--rule-config "$DG_RULE_CONFIG")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$DG_LIB_SIGS" ] && args+=(--lib-signatures "$DG_LIB_SIGS")
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        for rule in ${DG_IGNORE//,/ }; do args+=(--ignore "$rule"); done
        deglyph scan "${args[@]}"

    # Publish findings to the Security tab. always() so a failing gate still
    # uploads; the gating step exported the SARIF path it wrote.
    - if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}

    # Markdown report for the PR comment (only on pull_request events when
    # comment=true). Runs with --fail-on never so a failing scan still produces
    # the comment; the gating step above is what fails the job.
    - id: dg-markdown
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        DG_PATH: ${{ inputs.path }}
        DG_BASELINE: ${{ inputs.baseline }}
        DG_ENTROPY: ${{ inputs.entropy }}
        DG_CVE: ${{ inputs.cve }}
        DG_OFFLINE: ${{ inputs.offline }}
        DG_LIB_SIGS: ${{ inputs.lib-signatures }}
        DG_NO_HARDEN: ${{ inputs.no-hardening }}
        DG_NO_FP: ${{ inputs.no-fingerprint }}
        DG_IGNORE: ${{ inputs.ignore }}
        DG_IGNORE_FILE: ${{ inputs.ignore-file }}
        DG_RULE_CONFIG: ${{ inputs.rule-config }}
      run: |
        args=("$DG_PATH" --fail-on never --format markdown --output "${RUNNER_TEMP}/deglyph-pr.md")
        [ -n "$DG_BASELINE" ] && args+=(--baseline "$DG_BASELINE")
        [ -n "$DG_IGNORE_FILE" ] && args+=(--ignore-file "$DG_IGNORE_FILE")
        [ -n "$DG_RULE_CONFIG" ] && args+=(--rule-config "$DG_RULE_CONFIG")
        [ "$DG_ENTROPY" = "true" ] && args+=(--entropy)
        [ "$DG_CVE" = "true" ] && args+=(--cve)
        [ "$DG_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$DG_LIB_SIGS" ] && args+=(--lib-signatures "$DG_LIB_SIGS")
        [ "$DG_NO_HARDEN" = "true" ] && args+=(--no-hardening)
        [ "$DG_NO_FP" = "true" ] && args+=(--no-fingerprint)
        for rule in ${DG_IGNORE//,/ }; do args+=(--ignore "$rule"); done
        deglyph scan "${args[@]}"

    - uses: actions/github-script@v7
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const marker = '<!-- deglyph-comment -->';
          const reportPath = path.join(process.env.RUNNER_TEMP, 'deglyph-pr.md');
          const body = marker + '\n' + fs.readFileSync(reportPath, 'utf8');
          const {data: comments} = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
