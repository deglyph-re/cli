name: Release

# Build and publish to PyPI when a v* tag is pushed. Uses PyPI Trusted
# Publishing (OIDC) -- no API token is stored in the repo. One-time setup on
# PyPI is required; see CONTRIBUTING.md -> Releasing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import deglyph; print(deglyph.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag != deglyph.__version__ $pkg"; exit 1; }

      - name: Build sdist and wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
