name: Release

# Build and publish to PyPI when a v* tag is pushed. Uses PyPI Trusted
# Publishing (OIDC); no API token is stored in the repo. One-time setup on
# PyPI is required; see CONTRIBUTING.md -> Releasing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import deglyph; print(deglyph.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag != deglyph.__version__ $pkg"; exit 1; }

      - name: Build sdist and wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Create the GitHub Release once, so the per-OS standalone builds have a
  # target to attach to. --verify-tag ties it to the pushed tag; a re-run finds
  # the release already present and is a no-op.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  # A self-contained zipapp per OS: one file bundling deglyph and its
  # dependencies, runnable as `python deglyph-<os>.pyz` on a host with Python
  # 3.10+ (no pip install needed). Compiled deps (LIEF, Capstone) are platform
  # specific, so each OS builds its own.
  standalone:
    needs: github-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zipapp
        shell: bash
        run: |
          python -m pip install --upgrade pip shiv
          python -m shiv -c deglyph -o "deglyph-${{ runner.os }}.pyz" .
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "deglyph-${{ runner.os }}.pyz" --clobber
