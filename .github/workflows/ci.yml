name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cross toolchains for fixtures (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Build regression fixtures
        shell: bash
        run: bash samples/build_fixtures.sh

      - name: Lint (ruff)
        run: ruff check deglyph scripts tests

      - name: Format (black)
        run: black --check deglyph scripts tests

      - name: Type check (mypy)
        run: mypy deglyph

      - name: Tone contract (verify)
        run: python scripts/verify.py

      - name: Test
        run: pytest --cov --cov-report=term-missing
