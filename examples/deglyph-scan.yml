# Example consumer workflow: scan a release binary on every push and pull
# request. Findings land in three places -- the Actions run summary, the
# Security tab (code scanning), and a sticky PR comment.
# Copy this into your project's .github/workflows/ and edit `path`.
name: binary scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # upload-sarif -> code scanning
  pull-requests: write # comment -> sticky PR comment

jobs:
  deglyph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build your binary here, then point `path` at the artifact.
      # - run: make release

      - name: Scan with deglyph
        uses: deglyph-re/cli@v1.0.0
        with:
          path: build/app # file or directory
          fail-on: warning # error | warning | note | never
          upload-sarif: "true" # publish to the Security tab
          comment: "true" # sticky PR comment with the report
          # Suppress known findings, committed in version control:
          ignore-file: .deglyphignore
